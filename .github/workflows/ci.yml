name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vendkit?schema=public
      JWT_SECRET: ci-only-secret-value-that-is-at-least-32-characters
      API_KEY: ci-only-api-key-value
      NEST_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @repo/database build

      - run: pnpm lint

      - run: pnpm check-types

      - run: pnpm --filter api test

      - run: pnpm --filter web test

      - run: pnpm build
