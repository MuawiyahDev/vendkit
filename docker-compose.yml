services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vendkit
    volumes:
      - vendkit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vendkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/vendkit?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      CORS_ORIGINS: ${APP_URL:-http://localhost:3000}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      IMAGE_STORAGE_DIR: /data/images
      BACKUP_STORAGE_DIR: /data/backups
      APP_VERSION: ${APP_VERSION:-0.1.0}
    volumes:
      - vendkit-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEST_API_URL: http://api:4000/api
      API_KEY: ${API_KEY:?Set API_KEY in .env}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  vendkit-db:
  vendkit-data:
